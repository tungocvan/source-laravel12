name: inafo-pharma

services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    logging: &json_logs
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    mem_limit: 1200m
    cpus: 1.5

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
      - socket
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *json_logs
    mem_limit: 128m
    cpus: 0.25

  queue:
    build:
      context: .
      target: app
    env_file: .env
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=facebook,default", "--sleep=3", "--tries=3", "--timeout=660", "--max-time=3600"]
    stop_grace_period: 12m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    logging: *json_logs
    mem_limit: 1400m
    cpus: 1.5

  scheduler:
    build:
      context: .
      target: app
    env_file: .env
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    logging: *json_logs
    mem_limit: 256m
    cpus: 0.25

  socket:
    build:
      context: .
      target: socket
    environment:
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      BRIDGE_SECRET_KEY: ${BRIDGE_SECRET_KEY:?Set BRIDGE_SECRET_KEY in .env}
      NODEJS_SERVER_PORT: ${NODEJS_SERVER_PORT:-6001}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6001:6001"
    logging: *json_logs
    mem_limit: 256m
    cpus: 0.25

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *json_logs
    mem_limit: 1200m
    cpus: 1.5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *json_logs
    mem_limit: 384m
    cpus: 0.5

volumes:
  app_storage:
  mariadb_data:
  redis_data:
