services:
  scheduler:
    build:
      context: .
      target: app
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        NODE_VERSION: ${NODE_VERSION:-22}
        INSTALL_LIBREOFFICE: ${INSTALL_LIBREOFFICE:-true}
    env_file: .env
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]chedule:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}
    cpus: ${SCHEDULER_CPU_LIMIT:-0.25}
