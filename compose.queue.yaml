services:
  queue:
    build:
      context: .
      target: app
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        NODE_VERSION: ${NODE_VERSION:-22}
        INSTALL_LIBREOFFICE: ${INSTALL_LIBREOFFICE:-true}
    env_file: .env
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - --queue=${QUEUE_NAMES:-default}
      - --sleep=${QUEUE_SLEEP:-3}
      - --tries=${QUEUE_TRIES:-3}
      - --timeout=${QUEUE_TIMEOUT:-660}
      - --max-time=${QUEUE_MAX_TIME:-3600}

    stop_signal: SIGTERM
    stop_grace_period: 15s
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[q]ueue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    mem_limit: ${QUEUE_MEMORY_LIMIT:-1400m}
    cpus: ${QUEUE_CPU_LIMIT:-1.5}

